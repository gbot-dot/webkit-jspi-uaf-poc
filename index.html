<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>JSPI RestoreFrameMode repro — Safari 27.0 / 27.0.1</title>
<style>
body { font-family: system-ui, sans-serif; padding: 1rem; }
#result { margin-top: 1rem; padding: 1rem; border: 1px solid #ccc; white-space: pre-wrap; }
.ok { background: #e6ffe6; }
.err { background: #ffe6e6; }
</style>
</head>
<body>
<h1>JSPI RestoreFrameMode repro (bug 329633)</h1>
<p>Expected on Chrome / patched Safari: <code>42</code></p>
<p>Expected on Safari 27.0 / 27.0.1: <code>SuspendError: JSPI stack scan failed: unrecognized type of Wasm frame: RestoreFrameMode</code></p>
<div id="result">Running…</div>
<script type="module">
const result = document.getElementById('result');
try {
  // Module A: imports suspending, exports f that calls it
  const A = new Uint8Array([0,97,115,109,1,0,0,0,1,5,1,96,0,1,127,2,18,1,3,101,110,118,10,115,117,115,112,101,110,100,105,110,103,0,0,3,2,1,0,7,5,1,1,102,0,1,10,6,1,4,0,16,0,11]);
  // Module B: imports f from A, exports g that return_calls f
  const B = new Uint8Array([0,97,115,109,1,0,0,0,1,5,1,96,0,1,127,2,7,1,1,97,1,102,0,0,3,2,1,0,7,5,1,1,103,0,1,10,6,1,4,0,18,0,11]);

  const suspending = new WebAssembly.Suspending(() => 42);
  const a = new WebAssembly.Instance(new WebAssembly.Module(A), { env: { suspending } });
  const b = new WebAssembly.Instance(new WebAssembly.Module(B), { a: a.exports });

  const value = await WebAssembly.promising(b.exports.g)();
  result.textContent = 'Result: ' + value + '\n(expected 42 on patched builds)';
  result.className = 'ok';
} catch (e) {
  result.textContent = 'Caught: ' + e.name + ': ' + e.message + '\n(expected SuspendError on Safari 27.0 / 27.0.1)';
  result.className = 'err';
}
</script>
</body>
</html>
